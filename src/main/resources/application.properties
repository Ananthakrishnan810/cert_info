server.port=8080
spring.application.name=gmail-messaging-service

# Gmail SMTP Configuration (Port 587 STARTTLS)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:ethanhuntim10@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:imozwjgnnhnwxjrh}

# Spring Mail SMTP Properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
